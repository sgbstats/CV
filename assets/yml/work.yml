a:
  title: Research Technical Professional
  description: Manchester Metropolitan University
  date: 2026-
  details:
    - I am the statistician for the MMU's Centre for Digital Data Research
    - I am responsible for the statistics across the Centre's research projects, including the design, analysis and reporting of results (including Psychology, Economics and Sports Science).
    - I am the named statistician on multiple grant applications worth up to EUR 3m.
    - I have written R packages to support the analysis of data from multiple and unusual sources.
    - I worked with IT colleagues to develop the business case for GitHub Enterprise and expand GitHub Copilot access. I am a leader in the use of AI coding tools at MMU.
    - I delivered an R package #link("https://github.com/mmu-research-cloud-platform/facereaderconverter")[`facereaderconverter`] with end-to-end tests in around two months, supporting the #link("https://github.com/mmu-research-cloud-platform/library-of-happy-moments")[Library of Happy Moments] web app. This work contributes to research associated with a EUR 3m ERC grant and a potential UKRI innovation-funding resubmission.
    - I developed an R Shiny app #link("https://github.com/mmu-research-cloud-platform/library-of-happy-moments")[Library of Happy Moments] to show parents positive interactions with their children, integrating FFmpeg and FFprobe.
    - I created #link("https://github.com/sgbstats/research-video-sync")[research-video-sync], a PyPI package for reproducible bulk video synchronisation, and am preparing the #link("https://github.com/mmu-research-cloud-platform/facereaderconverter")[`facereaderconverter`] R package for a CRAN submission.
    - I use AI-assisted development and agentic review tools alongside end-to-end tests. CI uses synthetic data; real research data is kept outside CI and agent workflows using environment-configured paths. Access is managed with IT&D colleagues, and research protocols check pseudonymisation.
    - I lead workshops with global partner universities and have developed new metrics for the computational analysis of microtime psychology.
    - I was 3rd at the 2026 MMU Festival of Research in the Research Support Category.

b:
  title: Junior Medical Statistician
  description: Manchester University NHS Foundation Trust
  date: 2021-2026
  details:
    - I was involved in multiple studies and lead on statistical design and analysis from concept through to dissemination.
    - I supported all levels of researchers from undergraduate and postgraduate students, through to clinical academics and consultants.
    - I contributed to successful grant applications as a co-investigator and lead statistician (NIHR152516).
    - I was responsible for reviewing the design, statistical accuracy and overall viability of Trust-sponsored research protocols prior to ethics submission in collaboration with senior statisticians.
    - I presented my research at conferences both to technical and clinical audiences [NIHR Statistics Group Conference, 2023 (best e-poster); NHS R Community Conference, 2022; Translation Manchester, 2022 (People's Choice award)], NIHR Statistics Group Conference, 2024 [3rd place].
    - I had multiple collaborations with clinicians across the whole of MFT, The University of Manchester, and other trusts.
    - I gave multiple talks on statistics for critical appraisal across The Trust to the prestigious Specialist Foundation Program, junior doctors and level 7+ clinical practitioners.
    - I wrote teaching materials for improving statistical literacy among clinicians.
    - I gave guest lectures to undergraduates and apprentices on data literacy at Manchester Metropolitan University (Digital Marketer Degree Apprenticeship, and UG Marketing, Business & Marketing and Advertising & Brand Communications courses).

c:
  title: Statistician
  date: 2019-2021
  description: IQVIA
  details:
    - I worked with senior biostatistics staff on the evaluation, interpretation, and reporting of study results, including writing the analysis data reviewer’s guide for one study.
    - I quality controlled regulatory documents including CSRs, summaries of clinical efficacy and safety, prescribing information, and FDA briefing documents for large pivotal studies.
    - I assisted in developing study analysis plans, including sample size calculations and mock TFLs across multiple studies.
    - I gained experience in applying the principles in ICH E6 (GCP), E9 (Statistics), E9R1 (Estimands).
